name: nightly

# Every day after the Chilean night: check the last 3 Rubin nights for JWST, commit the
# results in output/, and publish the website (site/ + output/) to GitHub Pages.
on:
  schedule:
    - cron: "0 12 * * *"     # 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write            # commit output/
  pages: write               # deploy to Pages
  id-token: write            # required by deploy-pages
  actions: write             # keepalive: re-enable this workflow

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20      # a normal run takes ~1-2 min; never let a hung request run for hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the last 3 nights
        id: run
        timeout-minutes: 12  # leaves time for the keepalive step if this one times out
        env:
          LASAIR_TOKEN: ${{ secrets.LASAIR_TOKEN }}
        run: |
          set +e
          python jwst_alerts.py --no-plot --out output | tee run.txt
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "## Has Rubin seen JWST?"
            echo '```'
            cat run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # exit code 2 = a MATCH: a result, not a failure
          if [ "$code" -eq 2 ]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=JWST MATCH::Rubin alert within 2 arcsec of JWST. See output/jwst/alerts.csv"
            echo "### MATCH" >> "$GITHUB_STEP_SUMMARY"
            python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          m = json.load(open("output/jwst/latest.json"))["last_match"]
          print(f"{m['dayobs']} · {m['time_utc']} · band {m['band']} · {m['sep_arcsec']} arcsec · {m['lasair_url']}")
          PY
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Commit output/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "nightly: $(date -u +%F)$([ "${{ steps.run.outputs.match }}" = true ] && echo ' (MATCH)')"
            git push
          fi

      - name: Assemble the site
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R output _site/output
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Keepalive (scheduled workflows stop after 60 days without activity)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/enable"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
